<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teams Voice Inventory Dashboard</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #38bdf8;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
        --border: #334155;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
        color: var(--text);
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }

      .subtitle {
        color: var(--muted);
        margin-bottom: 20px;
      }

      .controls {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        display: grid;
        grid-template-columns: 2.4fr 1fr 1fr auto;
        gap: 12px;
        margin-bottom: 20px;
      }

      .controls label {
        display: flex;
        flex-direction: column;
        font-size: 0.8rem;
        color: var(--muted);
        gap: 6px;
      }

      .controls input,
      .controls button {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text);
        font-size: 0.96rem;
      }

      .controls button {
        cursor: pointer;
        background: var(--accent);
        color: #082f49;
        font-weight: 700;
        border: none;
        min-height: 44px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }

      .card {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      }

      .metric-label {
        color: var(--muted);
        display: block;
        font-size: 0.8rem;
        margin-bottom: 8px;
      }

      .metric-value {
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .dashboard {
        display: grid;
        grid-template-columns: 1.55fr 0.95fr;
        gap: 20px;
      }

      .panel {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }

      .panel h2 {
        margin: 0;
        padding: 16px 18px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 1.1rem;
      }

      .table-wrap {
        overflow: auto;
        max-height: 700px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 700px;
      }

      th,
      td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
        font-size: 0.92rem;
      }

      th {
        background: rgba(31, 41, 55, 0.9);
        color: var(--muted);
        position: sticky;
        top: 0;
        z-index: 1;
      }

      tr:hover {
        background: rgba(56, 189, 248, 0.04);
      }

      .pill {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        border: 1px solid transparent;
      }

      .pill.user {
        background: rgba(56, 189, 248, 0.15);
        color: #7dd3fc;
        border-color: rgba(56, 189, 248, 0.4);
      }
      .pill.resource {
        background: rgba(34, 197, 94, 0.12);
        color: #86efac;
        border-color: rgba(34, 197, 94, 0.4);
      }

      .chip-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 16px 18px 18px;
      }

      .chip {
        display: inline-block;
        background: rgba(34, 197, 94, 0.15);
        color: #bbf7d0;
        border: 1px solid rgba(34, 197, 94, 0.4);
        border-radius: 8px;
        padding: 6px 8px;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .empty {
        color: var(--muted);
        padding: 18px;
      }

      .alert {
        color: #fecaca;
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.25);
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 16px;
        display: none;
      }

      @media (max-width: 1024px) {
        .controls {
          grid-template-columns: 1fr;
        }

        .summary-grid {
          grid-template-columns: repeat(2, minmax(180px, 1fr));
        }

        .dashboard {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Teams Voice Inventory Dashboard</h1>
      <div class="subtitle">Inventory audit + available extension pool</div>

      <div id="alert" class="alert"></div>

      <div class="controls">
        <label>
          CSV path
          <input
            id="csvInput"
            type="text"
            value="./TeamsVoice_NumberInventory_latest.csv"
          />
        </label>
        <label>
          Extension start
          <input id="rangeStart" type="number" value="51000" />
        </label>
        <label>
          Extension end
          <input id="rangeEnd" type="number" value="51999" />
        </label>
        <button id="loadBtn">Load report</button>
      </div>

      <div class="summary-grid">
        <div class="card">
          <span class="metric-label">Total records</span>
          <span id="totalRecords" class="metric-value">0</span>
        </div>
        <div class="card">
          <span class="metric-label">Unique DDIs</span>
          <span id="distinctDdi" class="metric-value">0</span>
        </div>
        <div class="card">
          <span class="metric-label">Used extensions</span>
          <span id="usedExts" class="metric-value">0</span>
        </div>
        <div class="card">
          <span class="metric-label">Available in range</span>
          <span id="availableCount" class="metric-value">0</span>
        </div>
      </div>

      <div class="dashboard">
        <div class="panel">
          <h2>Inventory report</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Type</th>
                  <th>Display Name</th>
                  <th>UserPrincipalName</th>
                  <th>DDI</th>
                  <th>Extension</th>
                  <th>Voice Routing</th>
                </tr>
              </thead>
              <tbody id="inventoryBody"></tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <h2>Available 5-digit extensions</h2>
          <div id="availableList" class="chip-list"></div>

          <div style="padding: 0 18px 18px">
            <label
              style="
                display: block;
                color: var(--muted);
                font-size: 0.8rem;
                margin-bottom: 6px;
              "
            >
              Available DDI range
            </label>
            <div
              style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px"
            >
              <input
                id="ddiStart"
                type="text"
                value="+14255550000"
                style="
                  padding: 10px 12px;
                  border-radius: 8px;
                  border: 1px solid var(--border);
                  background: var(--panel-2);
                  color: var(--text);
                "
              />
              <input
                id="ddiEnd"
                type="text"
                value="+14255550999"
                style="
                  padding: 10px 12px;
                  border-radius: 8px;
                  border: 1px solid var(--border);
                  background: var(--panel-2);
                  color: var(--text);
                "
              />
            </div>
          </div>

          <div id="availableDdiList" class="chip-list"></div>
        </div>
      </div>
    </div>

    <script>
      const csvInput = document.getElementById("csvInput");
      const rangeStart = document.getElementById("rangeStart");
      const rangeEnd = document.getElementById("rangeEnd");
      const ddiStart = document.getElementById("ddiStart");
      const ddiEnd = document.getElementById("ddiEnd");
      const loadBtn = document.getElementById("loadBtn");
      const inventoryBody = document.getElementById("inventoryBody");
      const availableList = document.getElementById("availableList");
      const availableDdiList = document.getElementById("availableDdiList");
      const alertBox = document.getElementById("alert");

      const setAlert = (msg, isError = true) => {
        alertBox.textContent = msg;
        alertBox.style.display = msg ? "block" : "none";
        if (!msg) return;
        alertBox.style.borderColor = isError
          ? "rgba(239, 68, 68, 0.25)"
          : "rgba(34, 197, 94, 0.25)";
        alertBox.style.color = isError ? "#fecaca" : "#bbf7d0";
        alertBox.style.background = isError
          ? "rgba(239, 68, 68, 0.08)"
          : "rgba(34, 197, 94, 0.08)";
      };

      function parseCsv(text) {
        const rows = [];
        let current = "";
        let row = [];
        let inQuotes = false;

        const pushValue = () => {
          row.push(current);
          current = "";
        };

        const pushRow = () => {
          if (row.some((cell) => cell !== "")) {
            rows.push(row);
          }
          row = [];
        };

        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const next = text[i + 1];

          if (char === '"') {
            if (inQuotes && next === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === "," && !inQuotes) {
            pushValue();
          } else if ((char === "\n" || char === "\r") && !inQuotes) {
            if (char === "\r" && next === "\n") i++;
            pushValue();
            pushRow();
          } else {
            current += char;
          }
        }

        if (current.length > 0 || row.length > 0) {
          pushValue();
          pushRow();
        }

        if (rows.length < 2) return [];

        const [header, ...dataRows] = rows;
        return dataRows.map((values) => {
          const obj = {};
          header.forEach((key, idx) => {
            obj[key.trim()] = (values[idx] ?? "").trim();
          });
          return obj;
        });
      }

      function generateDdiRange(startValue, endValue) {
        const startDigits = (startValue || "").replace(/\D/g, "");
        const endDigits = (endValue || "").replace(/\D/g, "");
        if (!startDigits || !endDigits) return [];

        const startNumber = BigInt(startDigits);
        const endNumber = BigInt(endDigits);
        if (startNumber > endNumber) return [];

        const prefix = (startValue || "").startsWith("+") ? "+" : "";
        const result = [];
        for (let current = startNumber; current <= endNumber; current++) {
          result.push(`${prefix}${current.toString()}`);
        }
        return result;
      }

      function buildSummary(rows) {
        const uniqueDdi = new Set(rows.map((r) => r.DDI).filter(Boolean)).size;
        const usedExts = new Set(rows.map((r) => r.Extension).filter(Boolean))
          .size;
        const start = Number(rangeStart.value) || 0;
        const end = Number(rangeEnd.value) || 0;

        const occupied = new Set(
          rows.map((r) => String(r.Extension || "").trim()).filter(Boolean),
        );
        const available = [];
        for (let i = start; i <= end; i++) {
          const ext = String(i).padStart(5, "0");
          if (!occupied.has(ext)) available.push(ext);
        }

        const usedDdi = new Set(
          rows.map((r) => String(r.DDI || "").trim()).filter(Boolean),
        );
        const ddiRange = generateDdiRange(ddiStart.value, ddiEnd.value);
        const availableDdis = ddiRange.filter((value) => !usedDdi.has(value));

        document.getElementById("totalRecords").textContent = rows.length;
        document.getElementById("distinctDdi").textContent = uniqueDdi;
        document.getElementById("usedExts").textContent = usedExts;
        document.getElementById("availableCount").textContent =
          available.length;

        renderAvailable(available);
        renderAvailableDdi(availableDdis);
      }

      function renderAvailable(available) {
        availableList.innerHTML = "";
        if (!available.length) {
          availableList.innerHTML =
            '<div class="empty">No available extensions in the selected range.</div>';
          return;
        }

        available.slice(0, 120).forEach((num) => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = num;
          availableList.appendChild(chip);
        });
      }

      function renderAvailableDdi(values) {
        availableDdiList.innerHTML = "";
        if (!values.length) {
          availableDdiList.innerHTML =
            '<div class="empty">No available DDIs in the selected range.</div>';
          return;
        }

        values.slice(0, 120).forEach((value) => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.style.background = "rgba(56, 189, 248, 0.12)";
          chip.style.color = "#7dd3fc";
          chip.style.borderColor = "rgba(56, 189, 248, 0.4)";
          chip.textContent = value;
          availableDdiList.appendChild(chip);
        });
      }

      function renderTable(rows) {
        inventoryBody.innerHTML = "";

        if (!rows.length) {
          inventoryBody.innerHTML =
            '<tr><td colspan="6" class="empty">No rows in the CSV yet. Export a report first.</td></tr>';
          return;
        }

        rows.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
          <td><span class="pill ${row.AccountType === "ResourceAccount" ? "resource" : "user"}">${row.AccountType || "User"}</span></td>
          <td>${row.DisplayName || "-"}</td>
          <td>${row.UserPrincipalName || "-"}</td>
          <td>${row.DDI || "-"}</td>
          <td>${row.Extension || "-"}</td>
          <td>${row.VoiceRoutingPolicy || "N/A"}</td>
        `;
          inventoryBody.appendChild(tr);
        });
      }

      function getQueryParameters() {
        const params = new URLSearchParams(window.location.search);
        return {
          csv: params.get("csv") || "./TeamsVoice_NumberInventory_latest.csv",
          ddiStart: params.get("ddiStart") || "+14255550000",
          ddiEnd: params.get("ddiEnd") || "+14255550999",
        };
      }

      async function loadInventory() {
        const csvPath = csvInput.value.trim();
        if (!csvPath) {
          setAlert("Please specify a CSV path.");
          return;
        }

        try {
          setAlert("");
          const response = await fetch(csvPath, { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const text = await response.text();
          const rows = parseCsv(text);
          if (!rows.length) {
            setAlert("The CSV file is empty or malformed.");
            return;
          }

          renderTable(rows);
          buildSummary(rows);
          setAlert("Inventory loaded successfully.", false);
        } catch (err) {
          setAlert(
            `Unable to load CSV: ${csvPath}. Make sure the file exists and the page is being served over HTTP, not opened directly from disk.`,
          );
          console.error(err);
        }
      }

      loadBtn.addEventListener("click", loadInventory);
      window.addEventListener("DOMContentLoaded", () => {
        const query = getQueryParameters();
        csvInput.value = query.csv;
        ddiStart.value = query.ddiStart;
        ddiEnd.value = query.ddiEnd;
        loadInventory();
      });
    </script>
  </body>
</html>
